name: CI

# 什么时候跑：
#   1. **发版时**由 release.yml 复用（workflow_call）——镜像推送前先过这关，红了就不推；
#   2. 手动 dispatch（想单跑一遍看看）。
#
# push / PR 不触发：这个仓库的日常改动先在本地提交、攒到发版，没必要为每次 push 烧一遍 runner。
# 代价是「CI 绿不绿」到发版那一刻才见分晓，日常守门靠本地 make build + go test + svelte-check。
# 真实网络测试（LIVE=1）也不在这里跑——runner 的出口在哪不受控，红绿灯会被站点墙打乱。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: svelte-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web check
      - run: pnpm --dir web build
